<svg width="100%" height="200" viewBox="0 0 840 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: -0.025em;
      fill: #ffffff;
    }
    .role-primary {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
      fill: #e6edf3;
    }
    .role-secondary {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: -0.01em;
      fill: #8b949e;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: #8b949e;
    }
    .tag-label {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: -0.005em;
      fill: #c9d1d9;
    }
    .bg-rect {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.2;
    }
    .pill {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .live-dot {
      animation: pulse 2.5s infinite ease-in-out;
    }

    @media (prefers-color-scheme: light) {
      .title { fill: #111827; }
      .role-primary { fill: #374151; }
      .role-secondary { fill: #6b7280; }
      .status-text { fill: #4b5563; }
      .tag-label { fill: #111827; font-weight: 600; }
      .bg-rect {
        fill: #ffffff;
        stroke: #e5e7eb;
      }
      .pill {
        fill: #f3f4f6;
        stroke: #e5e7eb;
      }
    }
  </style>

  <!-- Matte Charcoal / Crisp White Card Background -->
  <rect x="1" y="1" width="838" height="198" rx="14" class="bg-rect" />

  <!-- Restrained Status Pill -->
  <g transform="translate(36, 28)">
    <rect width="280" height="26" rx="13" class="pill" />
    <circle cx="15" cy="13" r="4.5" fill="#22c55e" class="live-dot" />
    <text x="28" y="17" class="status-text">AVAILABLE FOR ROLES &amp; PROJECTS</text>
  </g>

  <!-- Title Name -->
  <text x="36" y="94" class="title">Mohamed Sameen S</text>

  <!-- Subtitle Track -->
  <text x="36" y="124">
    <tspan class="role-primary">Full-Stack AI &amp; Systems Engineer</tspan>
    <tspan class="role-secondary"> — Architecting resilient platforms &amp; intelligent workflows</tspan>
  </text>

  <!-- Metadata / Focus Pills (Unified Theme) -->
  <g transform="translate(36, 146)">
    <!-- Pill 1: Location -->
    <g transform="translate(0, 0)">
      <rect width="138" height="28" rx="6" class="pill" />
      <text x="12" y="19" class="tag-label">📍 Chennai, India</text>
    </g>

    <!-- Pill 2: Full-Stack -->
    <g transform="translate(150, 0)">
      <rect width="162" height="28" rx="6" class="pill" />
      <text x="12" y="19" class="tag-label">⚡ Full-Stack Systems</text>
    </g>

    <!-- Pill 3: Autonomous AI -->
    <g transform="translate(324, 0)">
      <rect width="194" height="28" rx="6" class="pill" />
      <text x="12" y="19" class="tag-label">🧠 Autonomous AI Pipelines</text>
    </g>

    <!-- Pill 4: Real-Time Ops -->
    <g transform="translate(530, 0)">
      <rect width="176" height="28" rx="6" class="pill" />
      <text x="12" y="19" class="tag-label">🔄 Real-Time Operations</text>
    </g>
  </g>
</svg>
