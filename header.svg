<svg width="100%" height="190" viewBox="0 0 800 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161f" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>
    <linearGradient id="border-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#484f58" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0d7de" />
    </linearGradient>
    <radialGradient id="ambient-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: -0.03em;
      fill: url(#name-grad);
    }
    .role {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: -0.01em;
      fill: #8b949e;
    }
    .role-strong {
      font-weight: 600;
      fill: #e6edf3;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: #7ee787;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: -0.01em;
      fill: #8b949e;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .pulse-dot {
      animation: pulse 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="798" height="188" rx="14" fill="url(#card-bg)" />
  <rect x="1" y="1" width="798" height="188" rx="14" fill="url(#ambient-glow)" />
  <rect x="1" y="1" width="798" height="188" rx="14" stroke="url(#border-stroke)" stroke-width="1.2" />

  <!-- Status Pill -->
  <g transform="translate(36, 32)">
    <rect width="258" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#3fb950" class="pulse-dot" />
    <text x="28" y="17" class="status-text">AVAILABLE FOR ROLES &amp; PROJECTS</text>
  </g>

  <!-- Name & Headline -->
  <text x="36" y="98" class="title">Mohamed Sameen S</text>

  <!-- Subtitle / Track -->
  <text x="36" y="126" class="role">
    <tspan class="role-strong">Full-Stack AI &amp; Software Engineer</tspan>
    <tspan> · Crafting intelligent systems &amp; web architectures</tspan>
  </text>

  <!-- Footer Tags -->
  <g transform="translate(36, 146)">
    <!-- Location Pill -->
    <g transform="translate(0, 0)">
      <rect width="124" height="24" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
      <text x="10" y="16" class="tag-text">📍 Chennai, India</text>
    </g>
    <!-- Focus Pill 1 -->
    <g transform="translate(132, 0)">
      <rect width="110" height="24" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
      <text x="10" y="16" class="tag-text">✦ Full-Stack Web</text>
    </g>
    <!-- Focus Pill 2 -->
    <g transform="translate(250, 0)">
      <rect width="102" height="24" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
      <text x="10" y="16" class="tag-text">✦ Applied AI</text>
    </g>
    <!-- Focus Pill 3 -->
    <g transform="translate(360, 0)">
      <rect width="128" height="24" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
      <text x="10" y="16" class="tag-text">✦ System Design</text>
    </g>
  </g>
</svg>
